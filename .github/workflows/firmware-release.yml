name: Build SmartFarm Firmware Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install cores and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32 arduino:avr
          arduino-cli lib install PubSubClient ArduinoJson "DHT sensor library" "Adafruit Unified Sensor"
      - name: Inject release version into runtime firmware
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '#define SMARTFARM_FIRMWARE_VERSION "%s"\n' "$VERSION" > esp32-gateway/ota/version.h
      - name: Compile ESP32 bootstrap
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 \
            --output-dir build/bootstrap esp32-gateway/bootstrap
      - name: Compile ESP32 OTA runtime
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 \
            --output-dir build/ota esp32-gateway/ota
      - name: Compile Arduino Nano Node
        run: |
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old \
            --output-dir build/node arduino-nano-node
      - name: Rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bootstrap_bin="$(find build/bootstrap -maxdepth 1 -type f -name '*.ino.bin' -print -quit)"
          ota_bin="$(find build/ota -maxdepth 1 -type f -name '*.ino.bin' -print -quit)"
          node_hex="$(find build/node -maxdepth 1 -type f -name '*.hex' -print -quit)"
          test -n "$bootstrap_bin"
          test -n "$ota_bin"
          test -n "$node_hex"
          cp "$bootstrap_bin" "dist/smartfarm-gateway-bootstrap-${GITHUB_REF_NAME}.bin"
          cp "$ota_bin" "dist/smartfarm-gateway-ota-${GITHUB_REF_NAME}.bin"
          cp "$node_hex" "dist/smartfarm-node-nano-${GITHUB_REF_NAME}.hex"
          (cd build/bootstrap && zip -q -r "../../dist/smartfarm-gateway-bootstrap-package-${GITHUB_REF_NAME}.zip" .)
          (cd build/ota && zip -q -r "../../dist/smartfarm-gateway-ota-package-${GITHUB_REF_NAME}.zip" .)
      - name: Generate checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
